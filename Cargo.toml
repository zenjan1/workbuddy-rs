[package]
name = "workbuddy-rs"
version = "0.1.1"
edition = "2021"
description = "WorkBuddy 非官方 Rust 复刻:多专家 AI 智能体工作台(规划 -> 并行执行 -> 综合报告)"
license = "MIT"

[[bin]]
name = "workbuddy"
path = "src/main.rs"

[dependencies]
axum = "0.8"
anyhow = "=1.0.104"
clap = { version = "=4.6.2", features = ["derive"] }
futures = "=0.3.33"
fs2 = "0.4"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
rustyline = { version = "13", features = ["case_insensitive_history_search"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.150"
schemars = { version = "0.8", features = ["derive"] }
dirs = "6"
dirs-next = "2"
tokio = { version = "1.39", features = ["full"] }
toml = "=0.8.2"
toml_edit = "0.22"
ratatui = { version = "0.29.0", features = ["crossterm"], optional = true }
crossterm = { version = "0.28.1", optional = true }
ureq = { version = "2", features = ["tls"] }
tiny_http = "0.12"
ctrlc = "3"
tower = { version = "0.5", features = ["util"] }
notify = { version = "6.0", features = ["mio"] }
hmac = "0.12"
sha2 = "0.10"
tar = "0.4"
zstd = "0.13"
keyring = "4.2.0"
csv = "1.3"
dialoguer = "0.12"
parquet = "51.0"
arrow = "51.0"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "chrono"] }
thiserror = "1.0"
async-trait = "0.1"
rusqlite = { version = "0.30", features = ["bundled"] }
sysinfo = "0.30"

# i18n dependencies
fluent = { version = "0.17", optional = true }
fluent-templates = { version = "0.11", optional = true }
unic-langid = { version = "0.9", optional = true }
unic-langid-impl = { version = "0.9", optional = true }

# Policy engine (OPA/Rego)
opa-wasm = { version = "0.3", optional = true }

[features]
default = ["i18n"]
i18n = ["fluent", "fluent-templates", "unic-langid", "unic-langid-impl"]
tui = ["ratatui", "crossterm"]
policy-engine = ["opa-wasm"]

[profile.release]
strip = true

[dev-dependencies]
hyper = "1.12.0"
http-body-util = "0.1"
tempfile = "3"
