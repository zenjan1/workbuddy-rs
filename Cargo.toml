[package]
name = "workbuddy-rs"
version = "0.1.0"
edition = "2021"
description = "WorkBuddy 非官方 Rust 复刻:多专家 AI 智能体工作台(规划 -> 并行执行 -> 综合报告)"
license = "MIT"

[[bin]]
name = "workbuddy"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.2", features = ["derive"] }
futures = "=0.3.33"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.150"
tokio = { version = "=1.53.0", features = ["full"] }
toml = "=0.8.2"

[profile.release]
strip = true
